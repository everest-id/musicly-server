<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist Musicly</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0c;color:#f3f1ee;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box}
.card{max-width:420px;width:100%;background:#161617;border:1px solid #ffffff22;border-radius:28px;padding:28px;text-align:center}
h1{margin:0 0 6px;font-size:22px}p{color:#b9b4ad;line-height:1.5;font-size:14px}
a.btn,button{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:14px;border:0;border-radius:24px;background:#c2562b;color:#fff;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer}
button.alt{background:#ffffff14;color:#f3f1ee}
code{display:block;margin-top:10px;padding:12px;border-radius:14px;background:#ffffff0f;font-size:18px;letter-spacing:1px;user-select:all}
</style></head><body><div class="card">
<h1>Playlist dari Musicly</h1>
<p id="msg">Ketuk tombol di bawah untuk membuka playlist ini di aplikasi Musicly.</p>
<a class="btn" id="open" href="#">Buka di Musicly</a>
<code id="code">…</code>
<button class="alt" id="copy">Salin kode</button>
<p style="font-size:12px;margin-top:18px">Tombol tidak bekerja? Salin kode di atas, lalu di Musicly buka Perpustakaan → Impor → Kode playlist dan tempel.</p>
</div><script>
var id=(location.hash||"").replace("#","").toLowerCase();
var ok=/^[a-z0-9]{8}$/.test(id);
if(!ok){document.getElementById("msg").textContent="Tautan tidak valid.";document.getElementById("open").style.display="none";document.getElementById("code").style.display="none";document.getElementById("copy").style.display="none";}
else{var code="MP-"+id;document.getElementById("code").textContent=code;
document.getElementById("open").href="musicly://p/"+id;
document.getElementById("copy").onclick=function(){try{navigator.clipboard.writeText(code);this.textContent="Tersalin"}catch(e){}};
setTimeout(function(){location.href="musicly://p/"+id},400);}
</script></body></html>
